# The oldest Rust this crate supports; keeps clippy from suggesting newer APIs.
msrv = "1.85"

# Note on floats: energy and money in OICP are never floats, and this crate enforces that — but
# not here. `clippy::disallowed_types` fires on the `visit_f64` that serde's `Deserialize` derive
# generates for *every* struct, so as a lint it says nothing about the code that was written. The
# rule is checked instead by `cargo run -p xtask -- no-floats`, which scans the wire models, the
# sync engine and the CDR checker for float types in code this crate actually wrote. CI runs it.
