name: fuzz

# The targets compile on every push (see ci.yml). This is the other half: actually running them.
# A fuzzer needs wall-clock time, and the inputs worth finding are not found in the seconds a
# pull-request job can spare — so it runs nightly, from the seeded corpus, for a bounded time.
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to run each target
        default: '300'

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wire, identifiers, delta]
    steps:
      - uses: actions/checkout@v4
      # `cargo fuzz` needs nightly for the sanitizer instrumentation; nothing else here does.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # Seeds derived from the crate's own conformant messages and every identifier spelling the
      # specification prints. Starting from random bytes spends the whole budget reaching the first
      # line of the decoder.
      - run: cargo run -p xtask -- seed-fuzz
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ github.event.inputs.seconds || '300' }}
      # A crash is an input this crate could not survive; keep it so it can become a test.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
