name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test, lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features
      # Energy and money never touch a float. This one needs no specifications; the other three run
      # in the `spec` job below, which clones them.
      - run: cargo run -p xtask -- no-floats

  features:
    name: every feature on its own
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A feature that only compiles when another happens to be on is not a feature, and
      # `--all-features` is exactly the build that cannot tell.
      - run: |
          set -euo pipefail
          for feature in cpo emp transport client server sync eichrecht testkit schema cli; do
            echo "::group::$feature"
            cargo check --no-default-features --features "$feature" --all-targets
            echo "::endgroup::"
          done
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features full

  fuzz:
    name: fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `fuzz/` is its own workspace, so `cargo check` at the root never touches it and a change to
      # a public signature can break every target without a single job going red. Type-checking
      # them needs no nightly and no fuzzing run.
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

  msrv:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Kept in step with `rust-version` in Cargo.toml: the first release with edition 2024.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features --all-targets

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  spec:
    name: against the specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The specifications are CC BY-SA and are not redistributed here, so `endpoints`, `errata`
      # and `spec-sync` skip without them — which means they would never run in CI at all. Cloning
      # them is the difference between three checks and one.
      - name: clone the Hubject specifications
        run: |
          git clone --quiet https://github.com/hubject/oicp specs/oicp
          git clone --quiet https://github.com/hubject/oicp-cpo-2.3-api-doc specs/oicp-cpo-2.3-api-doc
          git clone --quiet https://github.com/hubject/oicp-emp-2.3-api-doc specs/oicp-emp-2.3-api-doc
      - run: cargo run -p xtask -- all

  site:
    name: documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: zola
      # `site/public` is generated and gitignored, so this is the only thing that proves the site
      # still builds. `check` also follows every internal link.
      - run: zola --root site build
      - run: zola --root site check

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      # `docsrs` gates the feature badges, exactly as docs.rs builds it — without it this job is
      # not checking the documentation anyone will actually read.
      RUSTDOCFLAGS: -D warnings --cfg docsrs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps
