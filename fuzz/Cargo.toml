[package]
name = "oicp-kit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
description = "Fuzz targets for oicp-kit; not published."
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = "1"
serde_json = "1"

[dependencies.oicp-kit]
path = ".."
features = ["cpo", "emp", "transport", "sync"]

# Fuzz targets are their own binaries and are never published.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identifiers"
path = "fuzz_targets/identifiers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "delta"
path = "fuzz_targets/delta.rs"
test = false
doc = false
bench = false
